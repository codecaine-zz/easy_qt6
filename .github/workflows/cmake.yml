name: CMake Build Matrix

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  BUILD_TYPE: Release
  # Qt WebEngine (Chromium) cannot use its sandbox on CI runners.
  QTWEBENGINE_DISABLE_SANDBOX: 1
  QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    # Qt's CMake packages need OpenGL/EGL/xkbcommon headers on Linux, and
    # WebEngine needs a few X11/NSS runtime libraries to load.
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
          libvulkan-dev libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
          libxkbfile1 libxshmfence1 libasound2t64 libdbus-1-3 libfontconfig1

    # WebEngineWidgets depends on the WebChannel and Positioning modules, so all
    # three must be installed or find_package(Qt6 ... WebEngineWidgets) fails.
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        modules: 'qtwebengine qtwebchannel qtpositioning'
        cache: true

    # Apple removed the legacy AGL.framework in modern macOS SDKs (Xcode 15/16).
    # Strip any -framework AGL references from Qt's cmake and prl files.
    - name: Patch Qt AGL on macOS
      if: runner.os == 'macOS'
      run: |
        QT_PATH="${Qt6_DIR:-$QT_ROOT_DIR}"
        if [ -z "$QT_PATH" ]; then
          QT_PATH="/Users/runner/work/easy_qt6/Qt"
        fi
        find "$QT_PATH" -type f \( -name "*.cmake" -o -name "*.prl" \) -exec sed -i '' -E 's/([ -]framework[ =]+AGL|-framework AGL)//g' {} + 2>/dev/null || true

    - name: Configure CMake
      run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build cpp/build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test
      run: ctest --test-dir cpp/build -C ${{ env.BUILD_TYPE }} --output-on-failure
